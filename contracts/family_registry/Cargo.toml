[package]
name = "family_registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban smart contract: Family registry, RBAC, member management"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
